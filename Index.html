<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0D2847">
<title>Happy Camper · Private Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D2847; --navy-dk:#071B35; --navy-lt:#EEF4FF;
  --gold:#B07C22; --gold-lt:#FBF5E6;
  --sakura:#E8A4B2; --sakura-lt:#FDF2F5;
  --cream:#FAF8F4; --ink:#0A1A2F; --ink-2:#233D5C; --ink-3:#5A7590; --ink-4:#90A8BE;
  --border:#D8E4F0; --border-lt:#EBF2FA; --white:#FFFFFF;
  --shadow:0 2px 12px rgba(13,40,71,.10),0 1px 3px rgba(13,40,71,.06);
  --radius:18px; --radius-md:12px; --radius-sm:8px;
  --font-serif:'Cormorant Garamond','Palatino Linotype',Georgia,serif;
  --font-sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;height:100%}
body{font-family:var(--font-sans);background:var(--cream);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;margin:0;padding:0}
a{color:inherit;text-decoration:none}
button{font-family:var(--font-sans);cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font-family:var(--font-sans)}
html,body{height:100%;margin:0;padding:0}

/* ═══ GATE ═══ */
#gate{position:fixed;inset:0;z-index:20000;background:linear-gradient(165deg,#0F3160 0%,#0D2847 55%,#04111F 100%);
  display:flex;align-items:center;justify-content:center;padding:26px 18px;overflow-y:auto}
#gate::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E") repeat;pointer-events:none}
#gate.hidden{display:none}
.gate-card{position:relative;width:100%;max-width:400px;text-align:center;color:#fff}
.gate-logo{height:46px;width:auto;margin:0 auto 20px;display:block;filter:drop-shadow(0 1px 6px rgba(0,0,0,.5))}
.gate-kana{font-family:var(--font-serif);font-size:11.5px;font-style:italic;letter-spacing:1.4px;color:rgba(255,255,255,.5);margin-bottom:6px}
.gate-h{font-family:var(--font-serif);font-size:clamp(28px,7vw,38px);font-weight:300;letter-spacing:.6px;line-height:1.15;margin-bottom:8px}
.gate-sub{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:26px}
.gate-p{font-size:13px;color:rgba(255,255,255,.62);line-height:1.6;margin:0 auto 22px;max-width:320px}
.gate-row{display:flex;gap:9px;max-width:340px;margin:0 auto}
.gate-input{flex:1;font-family:inherit;font-size:16px;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:13px 14px;min-height:50px;text-align:center;outline:none}
.gate-input::placeholder{color:rgba(255,255,255,.35)}
.gate-input:focus{border-color:var(--gold);background:rgba(255,255,255,.13)}
.gate-btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;
  background:var(--gold);color:#0D2847;border-radius:11px;padding:0 20px;min-height:50px;min-width:70px}
.gate-btn:active{opacity:.85}
.gate-err{color:#F3A3AD;font-size:12.5px;margin-top:14px;min-height:18px}
.gate-foot{font-size:11px;color:rgba(255,255,255,.32);margin-top:30px;line-height:1.7;letter-spacing:.3px}
.gate-foot a{color:rgba(255,255,255,.5);text-decoration:underline}

/* ═══ HEADER ═══ */
#app-shell{display:none}
#app-shell.ready{display:block}
#app-header{position:fixed;top:0;left:0;right:0;z-index:9999;background-color:#0D2847;background-image:linear-gradient(160deg,#0F3160 0%,#0D2847 55%,#071B35 100%);border-bottom:1px solid rgba(255,255,255,.08)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px}
.hdr-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr-flag{font-size:17px;flex-shrink:0}
.hdr-dest{font-family:var(--font-serif);font-size:14px;font-weight:300;letter-spacing:.4px;color:#fff;white-space:nowrap}
.hdr-hc{font-size:8px;color:rgba(255,255,255,.40);letter-spacing:.8px;text-transform:uppercase;margin-top:1px}
.hdr-names{text-align:center;padding:0 14px 7px;border-bottom:1px solid rgba(255,255,255,.06)}
.hdr-name{font-family:var(--font-serif);font-size:clamp(22px,5vw,34px);font-weight:300;letter-spacing:.4px;color:#fff;line-height:1.15}
.hdr-name2{font-size:clamp(9px,1.8vw,11px);color:rgba(255,255,255,.45);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
.hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
#jst-clock{font-family:'SF Mono','Menlo',monospace;font-size:14px;font-weight:300;letter-spacing:1px;color:#fff;display:block;text-align:right;white-space:nowrap}
#trip-day-label{font-size:8.5px;color:rgba(255,255,255,.38);letter-spacing:.4px;margin-top:1px;display:block;text-align:right;white-space:nowrap}
.hdr-lock{background:none;border:0;color:rgba(255,255,255,.4);font-size:13px;padding:2px 4px;line-height:1}

/* ═══ TABS ═══ */
.tab-nav{display:flex;border-top:1px solid rgba(255,255,255,.07);overflow-x:auto;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.78);font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:9px 13px 7px;transition:color .18s,border-color .18s;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.tab-btn.active{color:var(--sakura);border-bottom-color:var(--sakura)}

#main-content{overflow-y:auto;-webkit-overflow-scrolling:touch;height:100vh}
.tab-panel{display:none;padding:14px 14px 80px;animation:panelFade .22s ease both}
.tab-panel.active{display:block}
@keyframes panelFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ═══ BANNER ═══ */
.trip-banner{background:linear-gradient(135deg,#0D2847 0%,#0A2040 55%,#04111F 100%);border-radius:var(--radius);padding:22px 20px 20px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
.trip-banner::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E") repeat}
.trip-banner-kana{font-family:var(--font-serif);font-size:11px;font-style:italic;opacity:.55;letter-spacing:1px;margin-bottom:4px;position:relative}
.trip-banner h2{font-family:var(--font-serif);font-size:28px;font-weight:300;letter-spacing:1px;margin-bottom:4px;position:relative}
.trip-banner .banner-dates{font-size:13px;opacity:.72;position:relative}
.banner-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;position:relative}
.banner-chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;font-size:11px}
.banner-chip.confirmed{background:rgba(217,234,211,.25);border-color:rgba(217,234,211,.5)}
.banner-chip.open{background:rgba(255,242,204,.16);border-color:rgba(255,242,204,.35)}

.section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-4);padding:8px 2px 6px}

.booking-legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 14px;background:var(--white);border-radius:var(--radius-md);margin-bottom:10px;border:1px solid var(--border-lt)}
.bl-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-3);font-weight:500}
.bl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.bl-dot.confirmed{background:#D9EAD3;border:1px solid rgba(27,94,32,.3)}
.bl-dot.requested{background:#00FFFF;border:1px solid rgba(0,77,86,.3)}
.bl-dot.self-booked{background:#F4CCCC;border:1px solid rgba(123,26,26,.3)}
.bl-dot.suggestion{background:#9FC5E8;border:1px solid rgba(13,60,110,.3)}
.bl-dot.walk-in{background:#FFF2CC;border:1px solid rgba(107,80,0,.3)}
.bl-dot.pending{background:#ECEFF1;border:1px solid rgba(84,110,122,.35)}

/* ═══ OPEN ITEMS ═══ */
.open-card{background:var(--white);border-radius:var(--radius);border:1px solid rgba(176,124,34,.3);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.open-head{background:linear-gradient(135deg,#3A2E22,#241B12);color:#E9C887;padding:14px 16px}
.open-head h3{font-family:var(--font-serif);font-size:19px;font-weight:400;letter-spacing:.3px;margin:0}
.open-head p{font-size:11.5px;opacity:.75;margin-top:2px}
.open-item{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border-lt);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.open-item:last-child{border-bottom:none}
.open-ico{font-size:16px;flex-shrink:0;margin-top:1px}
.open-item strong{color:var(--ink);display:block;margin-bottom:2px;font-size:13px}
.dl-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-lt)}
.dl-row:last-child{border-bottom:none}
.dl-what{font-size:13px;font-weight:500;color:var(--ink-2)}
.dl-note{font-size:11px;color:var(--ink-4);margin-top:2px}
.dl-when{font-size:13px;font-weight:600;color:#B5474F;white-space:nowrap;text-align:right}

/* ═══ DAY CARDS ═══ */
.day-card{background:var(--white);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border-lt);animation:cardIn .28s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.day-card.is-today{border-color:var(--navy);box-shadow:0 0 0 1.5px var(--navy),var(--shadow)}
.day-card.is-past{opacity:.58}
.day-header{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.day-num{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--border-lt);color:var(--ink-3)}
.day-card.is-today .day-num{background:var(--navy);color:#fff}
.day-header-info{flex:1;min-width:0}
.day-name{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-sub{font-size:11px;color:var(--ink-4);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.day-city-badge{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:#EBF3FF;color:#1A5FAA}
.day-city-badge.kyoto{background:#F1EBE0;color:#7A5C1F}
.today-pill{font-size:10px;font-weight:700;background:var(--navy);color:#fff;padding:2px 8px;border-radius:20px}
.host-pill{font-size:10px;font-weight:600;background:rgba(176,124,34,.15);color:var(--gold);padding:2px 8px;border-radius:20px;border:1px solid rgba(176,124,34,.25)}
.day-chevron{color:var(--ink-4);font-size:14px;flex-shrink:0;transition:transform .25s cubic-bezier(.4,0,.2,1)}
.day-card.open .day-chevron{transform:rotate(180deg)}
.day-body{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.4,0,.2,1)}
.day-card.open .day-body{max-height:6000px}
.day-body-inner{padding:0 16px 16px}

.hotel-bar{display:flex;align-items:center;gap:10px;border-radius:var(--radius-md);padding:10px 13px;margin-bottom:12px;background:#EBF4FF;border-left:3px solid #0D2847}
.hb-name{font-size:12px;font-weight:600;color:#0D2847}
.hb-detail{font-size:11px;color:#1A3F6F;margin-top:1px}
.hb-link{margin-left:auto;font-size:11px;font-weight:500;flex-shrink:0;color:#0D2847}
.day-note-bar{background:var(--navy-lt);border-radius:var(--radius-md);border-left:3px solid #4A80C0;padding:10px 13px;font-size:12px;color:var(--ink-2);line-height:1.55;margin-bottom:12px}
.weather-widget{display:flex;align-items:center;gap:10px;background:var(--gold-lt);border-radius:var(--radius-md);border:1px solid rgba(176,124,34,.15);padding:10px 13px;margin-bottom:14px}
.wx-icon{font-size:26px}.wx-info{flex:1}.wx-temp{font-size:14px;font-weight:600}.wx-desc{font-size:11px;color:var(--ink-3);margin-top:2px}.wx-rain{font-size:12px;font-weight:500;color:#1D6FAD;flex-shrink:0}
.wx-loading{font-size:12px;color:var(--ink-4);animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

.timeline{position:relative;padding-left:75px}
.stop-item{position:relative;margin-bottom:14px}
.stop-item::after{content:'';position:absolute;left:-16px;top:29px;bottom:-14px;width:2px;background:var(--border);z-index:1}
.stop-item:last-child::after{display:none}
.stop-time{position:absolute;left:-70px;top:11px;width:52px;text-align:right;font-size:9.5px;font-weight:600;color:var(--ink-4);line-height:1.4}
.stop-dot{position:absolute;left:-25px;top:9px;width:18px;height:18px;border-radius:50%;border:2.5px solid #ccc;background:#fff;z-index:2}
.stop-dot.t-restaurant{border-color:#8B1A1A;background:#F8EDED}
.stop-dot.t-activity{border-color:#6650CC;background:#EEE8FF}
.stop-dot.t-transport{border-color:#0D2847;background:#EEF4FF}
.stop-dot.t-hotel{border-color:#2E7D32;background:#E8F5E9}
.stop-dot.t-flight{border-color:#0277BD;background:#E1F5FE}
.stop-dot.t-suggestion{border-color:#1565C0;background:#E3F2FD}
.stop-dot.t-pending{border-color:#607D8B;background:#ECEFF1}
.stop-card{background:var(--cream);border-radius:var(--radius-md);border:1px solid var(--border-lt);padding:11px 13px}
.stop-card.is-suggestion{background:#F0F7FF;border-color:rgba(21,101,192,.15)}
.stop-card.is-pending{background:#F5F5F5;border-color:rgba(96,125,139,.15)}
.stop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.stop-title-wrap{flex:1;min-width:0}
.stop-icon{font-size:13px;margin-right:5px}
.stop-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3}
.stop-subtitle{font-size:11px;color:var(--ink-3);margin-top:2px}
.stop-badge{font-size:9.5px;font-weight:600;padding:3px 9px;border-radius:5px;flex-shrink:0;white-space:nowrap;letter-spacing:.1px}
.stop-badge.confirmed{background:#D9EAD3;color:#1B5E20;border:1px solid rgba(27,94,32,.18)}
.stop-badge.requested{background:#00FFFF;color:#004D56;border:1px solid rgba(0,77,86,.18)}
.stop-badge.self-booked{background:#F4CCCC;color:#7B1A1A;border:1px solid rgba(123,26,26,.18)}
.stop-badge.suggestion{background:#9FC5E8;color:#0D3C6E;border:1px solid rgba(13,60,110,.18)}
.stop-badge.walk-in{background:#FFF2CC;color:#6B5000;border:1px solid rgba(107,80,0,.18)}
.stop-badge.pending{background:#ECEFF1;color:#546E7A;border:1px solid rgba(84,110,122,.2)}
.stop-badge.logistics{background:#FFE0B2;color:#BF360C;border:1px solid rgba(191,54,12,.18)}
.stop-notes{font-size:12px;color:var(--ink-2);line-height:1.55;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-lt)}
.stop-alert{display:flex;align-items:flex-start;gap:6px;margin-top:8px;padding:7px 10px;background:#FFFBEB;border-radius:var(--radius-sm);border-left:3px solid #F59E0B;font-size:11px;color:#92400E;font-weight:500;line-height:1.4}
.map-actions{display:flex;gap:5px;margin-top:10px}
.map-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 5px;border-radius:var(--radius-sm);font-size:11px;font-weight:500;min-height:34px;border:1px solid var(--border);background:var(--white);color:var(--ink-2);cursor:pointer;-webkit-tap-highlight-color:transparent}
.map-btn:active{transform:scale(.96)}
.map-btn.map-disabled{color:var(--border);cursor:default;background:var(--border-lt);border-color:var(--border-lt);pointer-events:none;opacity:.4}
.map-btn.mp{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}

/* ═══ UTILITIES / CARDS ═══ */
.util-card{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border-lt);margin-bottom:12px}
.util-card-title{font-family:var(--font-serif);font-size:18px;font-weight:400;color:var(--ink);margin-bottom:14px;letter-spacing:.3px}
.fx-row{display:flex;gap:8px;align-items:flex-end}
.fx-group{flex:1}
.fx-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-4);margin-bottom:5px}
.fx-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:18px;font-weight:500;color:var(--ink);background:var(--cream);outline:none;-webkit-appearance:none}
.fx-input:focus{border-color:var(--navy)}
.fx-swap-btn{width:38px;height:38px;border-radius:50%;background:var(--navy-lt);border:none;color:var(--navy);font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:1px;cursor:pointer}
.fx-rate-note{font-size:11px;color:var(--ink-4);text-align:center;margin-top:10px;line-height:1.5}
.info-list{list-style:none}
.info-list li{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--border-lt);font-size:13px;line-height:1.55}
.info-list li:last-child{border-bottom:none;padding-bottom:0}
.info-emoji{font-size:17px;flex-shrink:0;margin-top:1px}
.info-text{color:var(--ink-2)}
.info-text strong{color:var(--ink);display:block;margin-bottom:1px}
.rule-item{padding:9px 0;border-bottom:1px solid var(--border-lt);display:flex;gap:10px;font-size:12.5px;line-height:1.5}
.rule-item:last-child{border-bottom:none}
.rule-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.rule-text strong{color:var(--ink)}

/* ═══ WISH / VISITED ═══ */
.wishlist-banner{background:linear-gradient(135deg,#4A1942 0%,#2D0F27 100%);border-radius:var(--radius);padding:22px 20px 18px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
.wishlist-banner h2{font-family:var(--font-serif);font-size:26px;font-weight:300;letter-spacing:.8px;margin-bottom:4px;position:relative}
.wishlist-banner p{font-size:12px;opacity:.65;position:relative}
.wish-card{background:var(--white);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border-lt);overflow:hidden}
.wish-row{display:flex;align-items:center;gap:14px;padding:14px 16px}
.wish-num{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4A1942,#2D0F27);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wish-info{flex:1;min-width:0}
.wish-name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.2}
.wish-style{font-size:10.5px;color:var(--ink-4);margin-top:2px}
.wish-actions{display:flex;gap:6px;flex-shrink:0}
.wish-map-btn{padding:7px 11px;border-radius:var(--radius-sm);font-size:11px;font-weight:500;border:1px solid var(--border);background:var(--white);color:var(--ink-2);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.wish-border{border-top:1px solid var(--border-lt)}

/* ═══ DIET ═══ */
.diet-banner{background:linear-gradient(135deg,#7C1D3A 0%,#4A0F22 100%);border-radius:var(--radius);padding:22px 20px 18px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
.diet-banner h2{font-family:var(--font-serif);font-size:26px;font-weight:300;letter-spacing:.8px;margin-bottom:4px;position:relative}
.diet-banner p{font-size:12px;opacity:.7;position:relative}

/* ═══ GUIDE ═══ */
.guide-banner{background:linear-gradient(135deg,#0D2847 0%,#12304F 55%,#071B35 100%);border-radius:var(--radius);padding:24px 20px 20px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden;border:1px solid rgba(176,124,34,.2)}
.guide-banner::before{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;background:radial-gradient(circle,rgba(176,124,34,.22) 0%,transparent 70%);pointer-events:none}
.guide-eyebrow{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px;position:relative;display:flex;align-items:center;gap:8px}
.guide-eyebrow::before{content:'';width:16px;height:1px;background:var(--gold)}
.guide-name{font-family:var(--font-serif);font-size:32px;font-weight:300;letter-spacing:.5px;line-height:1.1;position:relative}
.guide-nick{font-family:var(--font-serif);font-style:italic;font-size:16px;color:var(--gold);margin-top:2px;position:relative}
.guide-role{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:10px;line-height:1.55;position:relative}
.guide-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative}
.guide-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:4px 11px;font-size:11px}
.guide-actions{display:flex;gap:8px;margin-top:16px;position:relative;flex-wrap:wrap}
.guide-cta{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#0D2847;padding:11px 18px;border-radius:99px;font-size:12px;letter-spacing:.06em;font-weight:600;text-decoration:none}
.guide-cta.sec{background:transparent;color:#f3eee0;border:1px solid rgba(244,229,191,.32)}
.guide-intro{font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.cv-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-lt)}
.cv-item:last-child{border-bottom:none;padding-bottom:0}
.cv-period{flex:0 0 88px;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.02em;line-height:1.45;padding-top:2px}
.cv-body{flex:1;min-width:0}
.cv-org{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35}
.cv-place{font-size:11px;color:var(--ink-4);margin-top:2px;font-style:italic}
.cv-bullets{list-style:none;margin-top:7px}
.cv-bullets li{font-size:12.5px;color:var(--ink-2);line-height:1.55;padding-left:13px;position:relative;margin-bottom:3px}
.cv-bullets li::before{content:'·';position:absolute;left:3px;color:var(--ink-4);font-weight:700}
.why-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-lt);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.why-item:last-child{border-bottom:none}
.why-ico{color:var(--gold);flex-shrink:0;font-weight:700}

/* ═══ CONTACTS ═══ */
.emergency-banner{background:var(--navy);border-radius:var(--radius);padding:18px 20px;color:#fff;margin-bottom:14px;text-align:center}
.emergency-banner h2{font-family:var(--font-serif);font-size:22px;font-weight:300;letter-spacing:.5px;margin-bottom:4px}
.emergency-banner p{font-size:12px;opacity:.75}
.contact-card{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border-lt);margin-bottom:12px}
.contact-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border-lt);gap:10px}
.contact-row:last-child{border-bottom:none}
.contact-left{display:flex;align-items:center;gap:12px}
.contact-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.ci-r{background:#FFEBEE}.ci-g{background:#E8F5E9}.ci-b{background:#E3F2FD}.ci-n{background:var(--navy-lt)}.ci-o{background:#FFF3E0}
.contact-label{font-size:13px;font-weight:600;color:var(--ink)}
.contact-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.call-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;white-space:nowrap;border:none;cursor:pointer}
.cn{background:var(--navy);color:#fff}.cr{background:#C62828;color:#fff}
.cb{background:#0277BD;color:#fff}.co{background:var(--cream);color:var(--ink);border:1.5px solid var(--border)!important}

/* ═══ DISCOVER ═══ */
.disc-banner{background:linear-gradient(135deg,#0D2847 0%,#0A2040 55%,#04111F 100%);border-radius:var(--radius);padding:22px 20px 18px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
.disc-banner h2{font-family:var(--font-serif);font-size:26px;font-weight:300;letter-spacing:.8px;margin-bottom:4px;position:relative}
.disc-banner p{font-size:12px;opacity:.65;position:relative;margin:0}
.disc-city-bar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.disc-city-bar::-webkit-scrollbar{display:none}
.disc-city-pill{flex-shrink:0;background:var(--white);border:1px solid var(--border);color:var(--ink-3);padding:9px 16px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.disc-city-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.disc-scherrer{background:linear-gradient(180deg,#0D2847 0%,#142647 100%);color:#f3eee0;border-radius:var(--radius);padding:22px 20px 20px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid rgba(176,124,34,.2)}
.disc-scherrer::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(176,124,34,.2) 0%,transparent 70%);pointer-events:none}
.disc-scherrer-label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;position:relative}
.disc-scherrer-label::before{content:'';width:16px;height:1px;background:var(--gold)}
.disc-scherrer-title{font-family:var(--font-serif);font-size:26px;font-weight:300;margin:0 0 4px;color:#f3eee0;position:relative}
.disc-scherrer-by{font-family:var(--font-serif);font-style:italic;font-size:15px;color:var(--gold);margin-bottom:14px;position:relative}
.disc-scherrer-by .copy{font-size:11px;font-style:normal;letter-spacing:.06em;opacity:.7;margin-right:4px;font-family:var(--font-sans)}
.disc-scherrer-p{font-size:13px;line-height:1.6;color:rgba(243,238,224,.78);margin:0 0 16px;position:relative}
.disc-scherrer-cta{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#0D2847;padding:10px 18px;border-radius:99px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;text-decoration:none;position:relative}
.disc-scherrer-ig{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.05em;color:#f3eee0;border:1px solid rgba(244,229,191,.3);text-decoration:none;margin-top:2px}
.disc-scherrer-tip{margin-top:14px;font-size:12.5px;color:rgba(243,238,224,.55);font-style:italic;font-family:var(--font-serif);line-height:1.55;position:relative;padding-left:12px;border-left:1px solid rgba(176,124,34,.3)}
.disc-note{font-size:12px;color:var(--ink-3);font-style:italic;line-height:1.55;margin-bottom:10px;padding:8px 12px;background:var(--gold-lt);border-radius:8px;border-left:2px solid rgba(176,124,34,.4)}
.disc-card{background:var(--white);border:1px solid var(--border-lt);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.disc-card-head{padding:14px 18px 10px;border-bottom:1px solid var(--border-lt)}
.disc-card-head-title{font-family:var(--font-serif);font-size:18px;font-weight:500;color:var(--ink)}
.disc-card-body{padding:8px 12px 12px}
.disc-item{display:flex;align-items:center;gap:12px;padding:10px;background:var(--cream);border-radius:10px;margin-bottom:6px;text-decoration:none;border:1px solid var(--border-lt)}
.disc-item:last-child{margin-bottom:0}
.disc-item-info{flex:1;min-width:0}
.disc-item-name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.25}
.disc-item-sub{font-size:11px;color:var(--ink-3);margin-top:2px;font-style:italic}
.disc-arrow{font-size:16px;color:var(--gold);flex-shrink:0;opacity:.8}

#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(13,40,71,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;pointer-events:none;opacity:0;transition:all .22s cubic-bezier(.4,0,.2,1);z-index:999;white-space:nowrap;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(min-width:700px){
  .tab-nav{padding:0 30px}
  .tab-btn{font-size:12.5px;padding:10px 18px}
  .tab-panel{max-width:900px;margin-left:auto;margin-right:auto;padding:24px 32px 60px}
}
@media(prefers-color-scheme:dark){
  :root{--cream:#0E1824;--white:#141F2E;--border:#1E3248;--border-lt:#182840;--ink:#E8F2FF;--ink-2:#A8C0DC;--ink-3:#607A94;--ink-4:#3A5470;--navy-lt:#101E30;--gold-lt:#1A1508;--sakura-lt:#2A1A20}
}
</style>
</head>

var SS_KEY  = 'hci_rb_2026';

var D = null;            /* decrypted payload */
var FX_RATE = 156.88;    /* 1 USD = JPY — planning rate */

/* ═══ CRYPTO ═══ */
function b64d(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function deriveKey(pw,salt){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey'])
    .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);});
}
function decryptPayload(pw){
  var raw=b64d(ENC_APP);
  var salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  return deriveKey(pw,salt).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  }).then(function(buf){
    return JSON.parse(new TextDecoder().decode(buf));
  });
}

/* ═══ GATE ═══ */
var gate=document.getElementById('gate'),gErr=document.getElementById('gate-err'),gPw=document.getElementById('gate-pw');
function fail(msg){gErr.textContent=msg;gPw.value='';gPw.focus();}
function unlock(pw,silent){
  if(!pw){if(!silent)fail('Please enter the access code.');return;}
  if(!(window.crypto&&window.crypto.subtle)){
    fail('This browser cannot open the encrypted itinerary. Please open the file over https:// or in Safari/Chrome directly.');return;
  }
  gErr.textContent=silent?'':'Opening…';
  decryptPayload(pw).then(function(data){
    D=data;
    try{sessionStorage.setItem(SS_KEY,pw);}catch(e){}
    gate.classList.add('hidden');
    document.getElementById('app-shell').classList.add('ready');
    boot();
  }).catch(function(){
    try{sessionStorage.removeItem(SS_KEY);}catch(e){}
    if(!silent)fail('That code is not right. Please check and try again.');
    else gErr.textContent='';
  });
}
document.getElementById('gate-go').addEventListener('click',function(){unlock(gPw.value.trim(),false);});
gPw.addEventListener('keydown',function(e){if(e.key==='Enter')unlock(gPw.value.trim(),false);});
document.getElementById('btn-lock').addEventListener('click',function(){
  try{sessionStorage.removeItem(SS_KEY);}catch(e){}
  location.reload();
});
(function(){
  var saved=null;try{saved=sessionStorage.getItem(SS_KEY);}catch(e){}
  if(saved)unlock(saved,true);else setTimeout(function(){gPw.focus();},300);
})();

/* ═══ HELPERS ═══ */
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function gm(q){return(q&&q.indexOf('http')===0)?q:'https://maps.google.com/?q='+encodeURIComponent(q||'Tokyo Japan');}
function nav(q){return(q&&q.indexOf('http')===0)?q:'https://maps.google.com/maps?daddr='+encodeURIComponent(q||'Tokyo Japan')+'&dirflg=d';}
var toastTm;
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTm);toastTm=setTimeout(function(){el.classList.remove('show');},2200);}
window.copyAddr=function(di,si){
  var stop=D.trip.days[di].stops[si];
  var txt=(stop.addr&&stop.addr!=='Tokyo'&&stop.addr!=='Kyoto')?stop.addr:stop.loc;
  if(!txt)return;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){showToast('Address copied');});}
  else{var ta=document.createElement('textarea');ta.value=txt;ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Address copied');}
};
function infoItems(list){

function jst(){return new Date(Date.now()+9*3600000);}
function isoToday(){return jst().toISOString().slice(0,10);}
function tickClock(){
  var d=jst();
  document.getElementById('jst-clock').textContent=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  var today=d.toISOString().slice(0,10),found=null,T=D.trip;
  for(var i=0;i<T.days.length;i++){if(T.days[i].date===today){found=T.days[i];break;}}
  var lbl=document.getElementById('trip-day-label');
  if(found)lbl.textContent='Day '+found.dayNum+' of '+T.days.length+' · '+found.city;
  else if(today<T.startDate){var ms=new Date(T.startDate)-new Date(today);var d2=Math.ceil(ms/86400000);lbl.textContent=d2===1?'Tomorrow · Tokyo':d2+'d to Tokyo';}
  else if(today>T.endDate)lbl.textContent='Journey complete · Sayonara!';
  else lbl.textContent='Japan Standard Time';
}

/* ═══ WEATHER ═══ */
function wmo(c){
  if(c===0)return{i:'☀️',d:'Clear'};
  if(c<=2)return{i:'⛅',d:'Partly cloudy'};
  if(c===3)return{i:'☁️',d:'Overcast'};
  if(c>=45&&c<=48)return{i:'🌫️',d:'Foggy'};
  if(c>=51&&c<=67)return{i:'🌧️',d:'Rain'};
  if(c>=80&&c<=82)return{i:'🌦️',d:'Showers'};
  if(c>=95)return{i:'⛈️',d:'Thunderstorm'};
  return{i:'🌤️',d:'Mixed'};
}
function loadWeather(){
  var COORD={'Tokyo':[35.6762,139.6503],'Kyoto':[35.0116,135.7681],'Kamakura':[35.3192,139.5467],'Nara':[34.6851,135.8048]};
  var cities={};
  D.trip.days.forEach(function(d){cities[d.city]=COORD[d.city]||COORD['Tokyo'];});
  var names=Object.keys(cities);
  var reqs=names.map(function(c){
    var ll=cities[c];
    var u='https://api.open-meteo.com/v1/forecast?latitude='+ll[0]+'&longitude='+ll[1]+'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=Asia%2FTokyo&forecast_days=16';
    return fetch(u).then(function(r){return r.json();}).then(function(j){return {city:c,daily:j.daily};});
  });
  Promise.all(reqs).then(function(results){
    var byCity={};results.forEach(function(r){byCity[r.city]=r.daily;});
    D.trip.days.forEach(function(day){
      var src=byCity[day.city];
      var el=document.getElementById('wx-'+day.date);
      if(!el)return;
      var idx=src?src.time.indexOf(day.date):-1;
      if(!src||idx===-1){el.innerHTML='<span class="wx-icon">🍁</span><div class="wx-info"><div class="wx-temp" style="font-size:13px">Forecast available closer to the day</div><div class="wx-desc">'+esc(day.city)+' · late September / early October</div></div>';return;}
      var e=wmo(src.weathercode[idx]);
      el.innerHTML='<span class="wx-icon">'+e.i+'</span>'
        +'<div class="wx-info"><div class="wx-temp">'+Math.round(src.temperature_2m_max[idx])+'° / '+Math.round(src.temperature_2m_min[idx])+'°C · '+e.d+'</div>'
        +'<div class="wx-desc">'+esc(day.city)+' · early autumn</div></div>'
        +'<div class="wx-rain">💧 '+(src.precipitation_probability_max[idx]||0)+'%</div>';
    });
  }).catch(function(){
    D.trip.days.forEach(function(d){
      var el=document.getElementById('wx-'+d.date);
      if(el)el.innerHTML='<span class="wx-icon">🍁</span><div class="wx-info"><div class="wx-temp" style="font-size:13px">'+esc(d.city)+' · late September</div><div class="wx-desc">Early autumn · warm days, mild evenings, some rain</div></div>';
    });
  });
}

    +'</ul></div>'
    +'<div class="section-label">Dining Etiquette</div>'

    +'<div style="font-size:13px;line-height:1.6;color:var(--ink-2)">At an omakase counter every guest is served together and the room is built around the chef&rsquo;s craft. A few conventions keep the experience right for you, the chef and fellow diners &mdash; fragrance is the one that matters most.</div></div>'
    +'<div class="util-card"><div class="util-card-title">👔 Attire</div>'

    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>A collared shirt</strong> is a good choice for men at upscale counters; some rooms specify no t-shirts or shorts.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>Comfortable footwear</strong> &mdash; and shoes that come off easily, since many rooms require it.</div></div>'
    +'</div>'
    +'<div class="util-card"><div class="util-card-title">⏰ Punctuality</div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>Arrive on time, or a little early.</strong> In omakase the meal begins together &mdash; a late arrival breaks the flow for the chef and the other guests.</div></div>'

    +'<div class="util-card" style="border:1px solid rgba(176,124,34,.45)"><div class="util-card-title">🚫 Perfume &amp; Fragrance · most important</div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>No perfume or cologne.</strong> Even a light scent alters the sensory atmosphere of the room.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>Skip scented hair products and lotions</strong> &mdash; easily perceived in an intimate counter setting.</div></div>'

    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>Rest the free hand on the counter</strong> (or lightly support a bowl), not in your lap.</div></div>'

  var jEl=document.getElementById('fx-jpy'),uEl=document.getElementById('fx-usd');
  var grp=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
  function groupInt(d){return d===''?'':grp.format(parseInt(d,10));}
  function toEnd(el){try{var n=el.value.length;el.setSelectionRange(n,n);}catch(e){}}
  function fmtJPY(n){return isNaN(n)?'':grp.format(Math.round(n));}
  function fmtUSD(n){return isNaN(n)?'':new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);}
  function onJPY(){
    var d=jEl.value.replace(/[^0-9]/g,'');
    jEl.value=groupInt(d);toEnd(jEl);
    uEl.value=d===''?'':fmtUSD(parseInt(d,10)/FX_RATE);
  }
  function onUSD(){
    var m=uEl.value.replace(/,/g,'').match(/^(\d*)(\.?)(\d{0,2})/);
    var ip=m?m[1]:'',dot=m&&m[2]?'.':'',dp=m?m[3]:'';
    uEl.value=groupInt(ip)+dot+dp;toEnd(uEl);
    var v=(ip===''&&dp==='')?NaN:parseFloat((ip||'0')+'.'+(dp||'0'));
    jEl.value=isNaN(v)?'':fmtJPY(v*FX_RATE);
  }
  jEl.addEventListener('input',onJPY);
  uEl.addEventListener('input',onUSD);
  document.getElementById('fx-swap').addEventListener('click',function(){
    var jv=parseInt(jEl.value.replace(/[^0-9]/g,'')||'',10);
    var em=uEl.value.replace(/,/g,'').match(/^(\d*)\.?(\d{0,2})/);
    var ev=em?parseFloat((em[1]||'0')+'.'+(em[2]||'0')):NaN;
    jEl.value=isNaN(ev)?'':fmtJPY(ev*FX_RATE);
    uEl.value=isNaN(jv)?'':fmtUSD(jv/FX_RATE);
  });
  onJPY();
}

/* ═══ RENDER · CONTACTS ═══ */
function renderEmergency(){
  function rows(list){
    return list.map(function(c){
      var btn=c.action
        ?(c.action.indexOf('http')===0
          ?'<a href="'+c.action+'" target="_blank" rel="noopener" class="call-btn '+c.btnCls+'">'+c.btn+'</a>'
          :'<a href="'+c.action+'" class="call-btn '+c.btnCls+'">'+c.btn+'</a>')
        :'<span class="call-btn '+c.btnCls+'">'+esc(c.btn)+'</span>';
      return '<div class="contact-row"><div class="contact-left"><div class="contact-icon '+c.cls+'">'+c.icon+'</div>'
        +'<div><div class="contact-label">'+esc(c.label)+'</div><div class="contact-sub">'+esc(c.sub)+'</div></div></div>'+btn+'</div>';
    }).join('');
  }
  document.getElementById('tab-emergency').innerHTML=''
    +'<div class="emergency-banner"><h2>Contacts &amp; Emergency</h2><p>Your trip team · hotels · Japan emergency services · medical · embassies</p></div>'
    +'<div class="section-label">Happy Camper · Your Team</div>'
    +'<div class="contact-card">'+rows(D.contactsTeam)+'</div>'
    +'<div class="section-label">Hotels</div>'
    +'<div class="contact-card">'+rows(D.hotels)+'</div>'
    +'<div class="section-label">Emergency Numbers</div>'
    +'<div class="contact-card">'
    +'<div class="contact-row"><div class="contact-left"><div class="contact-icon ci-r">🚨</div><div><div class="contact-label">Police</div><div class="contact-sub">All emergency police calls</div></div></div><a href="tel:110" class="call-btn cr">📞 110</a></div>'
    +'<div class="contact-row"><div class="contact-left"><div class="contact-icon ci-r">🚑</div><div><div class="contact-label">Ambulance &amp; Fire</div><div class="contact-sub">Medical emergencies · nationwide</div></div></div><a href="tel:119" class="call-btn cr">📞 119</a></div>'
    +'<div class="contact-row"><div class="contact-left"><div class="contact-icon ci-g">🗣</div><div><div class="contact-label">Japan Visitor Hotline</div><div class="contact-sub">JNTO · English · 24 hours</div></div></div><a href="tel:+815038162787" class="call-btn cn">📞 Call</a></div>'
    +'</div>'
    +'<div class="section-label">Medical — English-friendly</div>'
    +'<div class="contact-card">'+rows(D.medical)+'</div>'
    +'<div class="section-label">Embassies · Tokyo</div>'
    +'<div class="contact-card">'+rows(D.embassies)+'</div>'
    +'<div class="util-card"><ul class="info-list">'+infoItems(D.copy.emergency)+'</ul></div>';
}

    if(h&&m){m.style.paddingTop=h.offsetHeight+'px';m.style.boxSizing='border-box';}
  }catch(e){}
}
window.addEventListener('resize',fixHeaderOffset);
window.addEventListener('unhandledrejection',function(e){e.preventDefault();});
